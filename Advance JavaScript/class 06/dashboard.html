<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        /* Header */
        .header {
            background: #667eea;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
        }

        /* Container */
        .container {
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        /* Form */
        .form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .form button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .form button:hover {
            background: #5a67d8;
        }

        /* Notes */
        .notes {
            display: grid;
            gap: 15px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-bottom: 5px;
            color: #333;
        }

        .card p {
            margin-bottom: 8px;
            color: #555;
        }

        .email {
            font-size: 12px;
            color: gray;
        }
    </style>
</head>

<body onload="renderUi()">

    <div class="header">
        Dashboard
    </div>

    <div class="container">

        <!-- Add Note Form -->
        <div class="form">
            <input type="text" id="title" placeholder="Enter title">
            <input type="text" id="desc" placeholder="Enter description">
            <button onclick="addNote()">Add Note</button>
        </div>

        <!-- Notes List -->
        <div id="parent" class="notes">

            <!-- Example Card -->
            <div class="card">
                <h2>Sample Title</h2>
                <p>This is a sample description</p>
                <p class="email">user@email.com</p>
            </div>

        </div>

    </div>

    <script src="dashboard.js"></script>
</body>
</html>
